# 파이보(PIBO) 보드 프로파일
#
# 여기 있는 값은 전부 pibo 레포에서 실제로 돌고 있던 값이다.
# 새 값을 추가할 때는 데이터시트나 실기로 확인된 것만 넣는다.
# 확인 안 된 값은 넣지 말고 [unverified] 절에 남긴다.
#   → docs/plan/00-decisions.md 2.4, docs/plan/README.md "상시 원칙"

name  = "pibo"
label = "파이보"

# ── 오디오 ────────────────────────────────────────────────
# openpibo/audio.py
[audio]
card           = "Headphones"   # amixer -c
mixer          = "PCM"          # amixer sset
default_volume = 80

[mic]
device   = "plug:dmic_sv"
channels = 2
rate     = 16000
format   = "S32_LE"

# ── 카메라 ────────────────────────────────────────────────
# openpibo/vision_camera.py
[camera]
width  = 640
height = 480
# read() 가 센서 프레임에 적용하는 변환.
#   flip_both  = cv2.flip(frame, -1)       (상하좌우 반전)
#   rot90ccw   = 반시계 90도 회전
#   none       = 그대로
transform = "flip_both"

# ── 디스플레이 ────────────────────────────────────────────
# openpibo/oled.py — driver 값이 어느 클래스를 쓸지 정한다.
#   ssd1306 -> Oled          (128x64 흑백, SPI)
#   ili9341 -> OledByPiBrain (240x320 컬러, SPI)
#   st7735  -> Oled7735      (미사용 / 미검증. docs/plan/04-known-issues.md 21)
[display]
driver    = "ssd1306"
width     = 128
height    = 64
font      = "KDL.ttf"          # KoPub Dotum Light
font_size = 10

# 부팅 화면 (system/booting.py)
[boot]
splash       = "pibo.jpg"
show_version = true            # 스플래시 위에 OS 버전을 겹쳐 쓴다
progress_sep = "˚"

# 네트워크 정보 화면 (system/network_disp.py)
# 128x64 와 240x320 은 글자 크기도 줄 수도 다르다. 레이아웃을 통째로 프로파일에 둔다.
[network_disp]
font_size = 13
layout = [
  { xy = [0,  5], text = "SN: {sn}" },
  { xy = [0, 25], text = "I P: {ip}" },
  { xy = [0, 45], text = "AP: {ssid}" },
]

# ── 그래픽 (openpibo/pibo_graphics.py) ────────────────────
[graphics]
width  = 320
height = 240

# ── 기능 플래그 ───────────────────────────────────────────
# 코드 분기와 블록 툴박스 필터링이 둘 다 이 값을 본다.
[features]
device_class = "Device"        # openpibo.device 에서 고를 클래스
has_legs     = true            # 다리 → motion.move(vx, vy) 노출
has_mcu      = true            # ATmega328P → system/mcu_control.py, uart_ctrl
has_buttons  = false           # GPIO 버튼 4개 (파이브레인 전용)
has_ws2812   = false           # 직결 WS2812 (파이보는 MCU 경유로 눈 LED 제어)

# ── 확인 필요 ─────────────────────────────────────────────
# docs/plan/00-decisions.md 2.4 — 데이터시트/실기로 확정하기 전까지 하드코딩하지 않는다.
# 값을 채우면 코드가 자동으로 그 값을 쓴다. 비어 있으면 소스의 현행 동작을 그대로 둔다.
[unverified]
display_rst_pin  = ""   # pibo 소스는 None. pibrain 레포는 board.D24 로 바꿔 놨는데
                        # 파이브레인은 SSD1306 을 안 쓰므로 검증된 적이 없다.
ws2812_level_shifter = ""   # Pi GPIO 3.3V → WS2812 5V 로직. 시프터 유무 미확인
rail_headroom_note   = ""   # LCD 백라이트 + 스피커 + WS2812 동시 최대 부하 시 레일 여유
cma_reserved         = ""   # /proc/meminfo CmaTotal. 2GB 중 얼마가 이미 빠져 있는지
