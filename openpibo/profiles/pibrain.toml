# 파이브레인(PiBrain) 보드 프로파일
#
# 여기 있는 값은 전부 pibrain 레포에서 실제로 돌고 있던 값이다.
# 확인 안 된 값은 넣지 말고 [unverified] 절에 남긴다.
#   → docs/plan/00-decisions.md 2.4

name  = "pibrain"
label = "파이브레인"

# ── 오디오 ────────────────────────────────────────────────
[audio]
card           = "MAX98357A"
mixer          = "PCM"
default_volume = 100

[mic]
device   = "plug:dmic_sv"
channels = 2
rate     = 44100
format   = "S16_LE"

# ── 카메라 ────────────────────────────────────────────────
# 파이브레인은 카메라가 세로로 붙어 있다. 640x480 을 받아 480x640 으로 세운다.
[camera]
width     = 480
height    = 640
transform = "rot90ccw"

# ── 디스플레이 ────────────────────────────────────────────
[display]
driver    = "ili9341"
width     = 240
height    = 320
font      = "NS_CJK_R.otf"     # Noto Sans CJK Regular
font_size = 10

[boot]
splash       = "pibrain320.jpg"
show_version = false           # 스플래시가 화면을 다 채운다
progress_sep = "-"

[network_disp]
font_size = 20
layout = [
  { xy = [15,  50], text = "*Wifi ----------------------" },
  { xy = [15,  85], text = "i p : {ip}" },
  { xy = [15, 120], text = "ap : {ssid}" },
  { xy = [15, 180], text = "*System -----------------" },
  { xy = [15, 215], text = "sn : {sn}" },
  { xy = [15, 250], text = "os : {os_version}" },
]

# ── 그래픽 ────────────────────────────────────────────────
[graphics]
width  = 240
height = 320

# ── 기능 플래그 ───────────────────────────────────────────
[features]
device_class = "DeviceByPiBrain"
has_legs     = false           # 다리가 없다 → motion.move() 를 노출하지 않는다
has_mcu      = false           # MCU 가 없다 → mcu_control / uart_ctrl 미사용
has_buttons  = true            # GPIO 4, 17, 27, 26
has_ws2812   = true            # GPIO 12 에 WS2812 1개 직결
has_usb_uart = true            # USB 시리얼로 외부 장치 붙이기 (openpibo.usb_uart)
can_record_audio = false       # pibrain 레포가 audio_record 블록을 꺼 놨던 것을 그대로 옮긴 값.
                               # 하드웨어로 확인한 사실이 아니다. 마이크가 되는 것이
                               # 확인되면 true 로 올릴 것.
has_display_invert = false   # ILI9341 컬러 — 반전 명령이 없다 (OledByPiBrain 에 invert() 없음)

# ── 확인 필요 ─────────────────────────────────────────────
[unverified]
display_rst_pin      = ""   # OledByPiBrain 현행 소스는 rst=None
ws2812_level_shifter = ""
rail_headroom_note   = ""
cma_reserved         = ""
